[project]
name = "framework"
version = "0.1.0"
description = "Initial Test Framework"
authors = [
    {name = "Sh"}
]
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
    "robotframework (>=7.4.2,<8.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "framework", from = "src" }
]